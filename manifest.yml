modules:
  # Premise byline button: shows on every Confluence page next to the author line.
  # Clicking it opens a panel that extracts and saves the decision's assumptions.
  confluence:contentBylineItem:
    - key: premise-byline
      resource: main
      render: native
      resolver:
        function: resolver
      title: Premise
      tooltip: Check the assumptions behind this decision
      # Confluence calls this on page load; its title replaces the byline label.
      dynamicProperties:
        function: bylineProps
  # Second entry point: page "More actions" menu opens Premise in a dialog.
  confluence:contentAction:
    - key: premise-content-action
      resource: main
      render: native
      resolver:
        function: resolver
      title: "Premise: check assumptions"
  # Dashboard: Confluence sidebar > Apps > Premise (all decisions in one place).
  confluence:globalPage:
    - key: premise-dashboard
      resource: dashboard
      render: native
      resolver:
        function: resolver
      title: Premise
      route: decisions
  # Teamwork Graph connector: writes each tracked decision into the graph.
  graph:connector:
    - key: premise-decisions
      name: Premise decisions
      icons:
        light: https://raw.githubusercontent.com/gunalanmoorthy-dev/premise/main/src/icons/premise.svg
        dark: https://raw.githubusercontent.com/gunalanmoorthy-dev/premise/main/src/icons/premise.svg
      objectTypes:
        - atlassian:document
      capabilities:
        replicatesPermissions: false
        syncFidelity: upsert
        supportsIncrementalSync: true
      datasource:
        onConnectionChange:
          function: onConnectionChange
  # Rovo agent: ask Premise about decisions in chat (Confluence, Jira, Rovo).
  rovo:agent:
    - key: premise-agent
      name: Premise
      description: Tells you which team decisions rest on assumptions that no longer hold, what evidence broke them, and what else is at risk.
      prompt: >
        You are Premise, an agent that watches the assumptions behind team decisions
        (architecture decisions, ADRs, product choices) written in Confluence.

        Every tracked decision has assumptions. Each assumption can have a tripwire:
        a Jira search that trips when more than N issues match, or a date. When a
        tripwire trips, the assumption is BROKEN, Premise opens a revisit ticket in
        Jira and assigns it to the decision owner.

        How to help:
        - "What is at risk?", "any broken decisions?", "status": use list-decisions
          (set onlyBroken to true when the user only wants problems).
        - Questions about one decision ("why is the Postgres decision broken?",
          "what depends on this?"), or "this page" while on a Confluence page: use
          explain-decision. Leave decision empty to mean the current page.
        - "Check again", "re-run", "is it still broken?": use check-decision.
        - "Track this", "watch this decision": use track-decision.

        Answer style:
        - Lead with the verdict: which decisions are broken and why, in one or two sentences.
        - For each broken assumption give the evidence (matching Jira issues by key),
          the revisit ticket key, and who is affected.
        - If other decisions depend on a broken one, say so clearly: they are at risk too.
        - Include page links when you have them. Be brief. Never invent issues or tickets;
          only report what the actions return.
        - If an action returns an error or note, tell the user plainly what to do next.
        - Never output empty bullet points or empty list items.

        When asked how to fix a broken assumption, offer these three options, tied to
        the actual evidence:
        1. Change the decision: the assumption is really false, so revisit it, edit the
           Confluence page, then use Extract again and Save and check in the Premise panel.
        2. Fix the reality: resolve the issues behind the evidence. Note that a Jira
           tripwire counts closed issues too unless its search excludes them
           (for example add AND statusCategory != Done).
        3. Accept the risk: the team agrees the limit was too strict, so raise the limit
           with Edit tripwires and close the revisit ticket with the reason.
        Recommend one of them based on the evidence and say who should decide (the
        decision owner).
      conversationStarters:
        - Which of our decisions are at risk right now?
        - Why is the Postgres decision broken?
        - What depends on this decision?
        - Track this decision
      actions:
        - list-decisions
        - explain-decision
        - check-decision
        - track-decision
  action:
    - key: list-decisions
      name: List decisions
      function: listDecisions
      actionVerb: GET
      description: >
        Lists every decision Premise tracks with its health, broken assumptions,
        Jira evidence, revisit tickets, people involved and decisions at risk.
      inputs:
        onlyBroken:
          title: Only broken
          type: boolean
          required: false
          description: Set to true to return only decisions with broken assumptions.
    - key: explain-decision
      name: Explain a decision
      function: explainDecision
      actionVerb: GET
      description: >
        Returns one tracked decision in full: each assumption, its status and evidence,
        its tripwire, revisit ticket, the people behind it, what it builds on and which
        decisions depend on it (from Teamwork Graph).
      inputs:
        decision:
          title: Decision
          type: string
          required: false
          description: Page title words, page link or page ID. Leave empty for the current Confluence page.
    - key: check-decision
      name: Check a decision now
      function: checkDecision
      actionVerb: TRIGGER
      description: >
        Re-runs every tripwire of one decision right now, opens revisit tickets for new
        breaks, and returns the fresh result.
      inputs:
        decision:
          title: Decision
          type: string
          required: false
          description: Page title words, page link or page ID. Leave empty for the current Confluence page.
    - key: track-decision
      name: Track a decision
      function: trackDecision
      actionVerb: CREATE
      description: >
        Starts tracking a Confluence decision page: extracts its assumptions with AI,
        suggests tripwires and checks them straight away.
      inputs:
        decision:
          title: Decision
          type: string
          required: false
          description: Page title words, page link or page ID. Leave empty for the current Confluence page.
  # MCP server: exposes Premise's actions as tools for external AI clients
  # (Claude, Cursor, VS Code). Endpoint: https://mcp.atlassian.com/forge/<appId>
  rovo:mcp:
    - key: premise-mcp
      name: Premise
      tools:
        - list-decisions
        - explain-decision
        - check-decision
        - track-decision
  # Forge LLMs: lets the backend call Claude on Atlassian infrastructure.
  llm:
    - key: premise-llm
      model:
        - claude
  # Monitoring webhook: Datadog, Grafana or Alertmanager alerts flip "alert" tripwires.
  webtrigger:
    - key: premise-alert-webhook
      function: alertWebhook
      response:
        type: dynamic
  # Hourly: re-check every saved tripwire, even when nobody opens the page.
  scheduledTrigger:
    - key: premise-hourly-check
      function: scheduledCheck
      interval: hour
  function:
    - key: listDecisions
      handler: index.listDecisions
    - key: explainDecision
      handler: index.explainDecision
    - key: checkDecision
      handler: index.checkDecision
    - key: trackDecision
      handler: index.trackDecision
    - key: resolver
      handler: index.handler
    - key: scheduledCheck
      handler: index.scheduledCheck
    - key: bylineProps
      handler: index.bylineProps
    - key: onConnectionChange
      handler: index.onConnectionChange
    - key: alertWebhook
      handler: index.alertWebhook
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: dashboard
    path: src/frontend/dashboard.jsx
permissions:
  scopes:
    # Read the current page's title and body.
    - read:page:confluence
    # Find decision pages across the site (Confluence CQL search).
    - search:confluence
    # Teamwork Graph: page owners, contributors and linked pages (the cascade).
    - read:graph:page:confluence
    - read:graph:user:atlassian
    # Teamwork Graph connector: write decision objects into the graph.
    - write:object:jira
    - read:object:jira
    - delete:object:jira
    # Save confirmed assumptions in Forge key-value storage.
    - storage:app
    # Count Jira issues that match a tripwire's JQL search.
    - read:jira-work
    # Open a "Revisit decision" ticket when an assumption breaks.
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/b4441ba6-5870-4a7b-9bed-a98b5174daf4
  # One installation for both apps, so Confluence and Jira share storage.
  compatibility:
    confluence:
      required: true
    jira:
      required: false
